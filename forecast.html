        function showForecastForDay(dayIndex) {
            if (dayIndex === null || !globalDailyPeriods.length) {
                createDetailedForcast(globalDailyPeriods);
                return;
            }
            
            if (dayIndex === 0) {
                createDetailedForcast(globalDailyPeriods);
                return;
            }
            
            const firstPeriodIsNight = !globalDailyPeriods[0].isDaytime;
            const dayOffset = firstPeriodIsNight ? (dayIndex * 2 - 1) : (dayIndex * 2);
            let dayPeriod = null;
            let nightPeriod = null;
            
            for (let i = dayOffset; i < Math.min(dayOffset + 2, globalDailyPeriods.length); i++) {
                const period = globalDailyPeriods[i];
                if (period.isDaytime) {
                    dayPeriod = period;
                } else {
                    nightPeriod = period;
                }
            }
            
            let html = '';
            
            if (dayPeriod) {
                const dayName = new Date(dayPeriod.startTime).toLocaleDateString('en-US', { weekday: 'long' });
                html += `
                    <div class="forecast-period">
                        <div class="forecast-period-title">${dayName}</div>
                        <div class="forecast-period-text">${dayPeriod.detailedForecast}</div>
                    </div>
                `;
            }
            
            if (nightPeriod) {
                const nightName = dayPeriod ? 
                    new Date(dayPeriod.startTime).toLocaleDateString('en-US', { weekday: 'long' }) + ' Night' : 
                    'Tonight';
                html += `
                    <div class="forecast-period">
                        <div class="forecast-period-title">${nightName}</div>
                        <div class="forecast-period-text">${nightPeriod.detailedForecast}</div>
                    </div>
                `;
            }
            
            document.getElementById('detailedForcast').innerHTML = html;
            document.getElementById('detailedForcast').style.display = 'block';
        }
        
        function createDetailedForcast(dailyPeriods) {
            const now = new Date();
            const currentHour = now.getHours();
            
            const showTonightTomorrow = currentHour >= 17 || currentHour < 6;
            
            let firstPeriod = null;
            let secondPeriod = null;
            let firstTitle = '';
            let secondTitle = '';
            
            if (showTonightTomorrow) {
                for (let i = 0; i < dailyPeriods.length; i++) {
                    const period = dailyPeriods[i];
                    if (!firstPeriod && !period.isDaytime) {
                        firstPeriod = period;
                        firstTitle = 'Tonight';
                    } else if (firstPeriod && !secondPeriod && period.isDaytime) {
                        secondPeriod = period;
                        secondTitle = 'Tomorrow';
                        break;
                    }
                }
            } else {
                for (let i = 0; i < dailyPeriods.length; i++) {
                    const period = dailyPeriods[i];
                    if (!firstPeriod && period.isDaytime) {
                        firstPeriod = period;
                        firstTitle = 'Today';
                    } else if (firstPeriod && !secondPeriod && !period.isDaytime) {
                        secondPeriod = period;
                        secondTitle = 'Tonight';
                        break;
                    }
                }
            }
            
            if (!firstPeriod && !secondPeriod) {
                document.getElementById('detailedForcast').style.display = 'none';
                return;
            }
            
            let html = '';
            
            if (firstPeriod) {
                html += `
                    <div class="forecast-period">
                        <div class="forecast-period-title">${firstTitle}</div>
                        <div class="forecast-period-text">${firstPeriod.detailedForecast}</div>
                    </div>
                `;
            }
            
            if (secondPeriod) {
                html += `
                    <div class="forecast-period">
                        <div class="forecast-period-title">${secondTitle}</div>
                        <div class="forecast-period-text">${secondPeriod.detailedForecast}</div>
                    </div>
                `;
            }
            
            document.getElementById('detailedForcast').innerHTML = html;
            document.getElementById('detailedForcast').style.display = 'block';
        }
        
        function alignDailyForecastWithChart() {
            const chart = charts['tempChart'];
            if (!chart) return;
            
            const totalOffsetLeft = -7;
            const dayElements = document.querySelectorAll('.day-forecast');
            
            globalDayBoundaries.forEach((boundaryIndex, dayIndex) => {
                if (dayIndex >= dayElements.length) return;
                
                const dayElement = dayElements[dayIndex];
                
                let startX, left;

                if (dayIndex === 0) {
                    startX = 0;
                    left = totalOffsetLeft;
                } else {
                    startX = chart.scales.x.getPixelForValue(boundaryIndex);
                    left = totalOffsetLeft + startX;
                }

                let endX;
                if (dayIndex < globalDayBoundaries.length - 1) {
                    endX = chart.scales.x.getPixelForValue(globalDayBoundaries[dayIndex + 1]);
                } else {
                    endX = chart.scales.x.getPixelForValue(globalHourlyData.length - 1);
                }

                const width = dayIndex === 0 ? 
                    (endX - chart.scales.x.getPixelForValue(boundaryIndex) + chart.scales.x.getPixelForValue(boundaryIndex)) : 
                    (endX - startX);
                
                dayElement.style.position = 'absolute';
                dayElement.style.left = `${left}px`;
                dayElement.style.width = `${width}px`;
                dayElement.style.maxWidth = 'none';
                dayElement.style.minWidth = '0';
                dayElement.style.height = 'auto';
            });
            
            requestAnimationFrame(() => {
                let maxHeight = 0;
                
                dayElements.forEach(dayElement => {
                    const elementHeight = dayElement.offsetHeight;
                    if (elementHeight > maxHeight) {
                        maxHeight = elementHeight;
                    }
                });
                
                // Ensure all day cards take the full uniform height so bottom-aligned badges line up perfectly
                dayElements.forEach(dayElement => {
                    dayElement.style.height = `${maxHeight}px`;
                });

                const dailyContainer = document.querySelector('.daily-forecast-container');
                if (dailyContainer) {
                    dailyContainer.style.height = `${maxHeight}px`;
                    
                    const lastDayElement = dayElements[dayElements.length - 1];
                    if (lastDayElement) {
                        const lastRight = parseFloat(lastDayElement.style.left) + parseFloat(lastDayElement.style.width);
                        dailyContainer.style.width = `${lastRight}px`;
                    }
                }

                // Keep scroll position in sync with charts
                const dailyForecastEl = document.getElementById('dailyForecastStrip');
                const chartsWrapperEl = document.getElementById('chartsWrapper');
                if (dailyForecastEl && chartsWrapperEl) {
                    chartsWrapperEl.scrollLeft = dailyForecastEl.scrollLeft;
                }
            });
        }
        
        function createDailyForecast(dailyPeriods, hourlyData) {
            globalDailyPeriods = dailyPeriods;
            
            const boundaries = [];
            let currentDay = null;
            
            hourlyData.forEach((hour, index) => {
                const dayStr = hour.time.toDateString();
                if (dayStr !== currentDay) {
                    boundaries.push(index);
                    currentDay = dayStr;
                }
            });
            
            globalDayBoundaries = boundaries;
            
            const now = new Date();
            const currentHour = now.getHours();
            const isPast5PM = currentHour >= 17;

            const firstDataDay = hourlyData[0].time.toDateString();
            const todayString = now.toDateString();
            const hasHistoricalDayData = firstDataDay !== todayString && hourlyData[0].time < now;

            const days = [];
            for (let i = 0; i < boundaries.length && i < 7; i++) {
                const startIdx = boundaries[i];
                const endIdx = boundaries[i + 1] || hourlyData.length;
                const dayHours = hourlyData.slice(startIdx, endIdx);
                
                if (dayHours.length > 0) {
                    const date = dayHours[0].time;
                    const isToday = i === 0;
                    
                    let lowTemp = null;
                    const lowTempHours = [];
                    
                    if (isToday && isPast5PM) {
                        hourlyData.forEach((hour) => {
                            const hourTime = hour.time;
                            if (hourTime >= now) {
                                const tomorrowMorning = new Date(now);
                                tomorrowMorning.setDate(tomorrowMorning.getDate() + 1);
                                tomorrowMorning.setHours(9, 0, 0, 0);
                                if (hourTime < tomorrowMorning) {
                                    lowTempHours.push(hour);
                                }
                            }
                        });
                    } else {
                        hourlyData.forEach((hour) => {
                            const hourTime = hour.time;
                            const hourOfDay = hourTime.getHours();
                            const dayDiff = Math.floor((hourTime - date) / (24 * 60 * 60 * 1000));
                            
                            if (dayDiff === 0 && hourOfDay >= 15) {
                                lowTempHours.push(hour);
                            } else if (dayDiff === 1 && hourOfDay < 9) {
                                lowTempHours.push(hour);
                            }
                        });
                    }
                    
                    const hoursForLow = lowTempHours.length > 0 ? lowTempHours : dayHours;
                    const lowTemps = hoursForLow.map(h => h.temperature).filter(t => t !== null);
                    if (lowTemps.length > 0) {
                        lowTemp = Math.min(...lowTemps);
                    }
                    
                    const highTemps = dayHours.map(h => h.temperature).filter(t => t !== null);
                    
                    let dayPeriod = null;
                    let maxPrecipProb = 0;
                    
                    for (const period of dailyPeriods) {
                        const periodDate = new Date(period.startTime);
                        if (periodDate.toDateString() === date.toDateString() && period.isDaytime) {
                            dayPeriod = period;
                            maxPrecipProb = Math.max(...dayHours.map(h => h.precipProbability));
                            break;
                        }
                    }
                    
                    const nowMs = now.getTime();
                    const getRemainingFraction = (h) => {
                        const startMs = h.time.getTime();
                        const endMs = startMs + 3600000;
                        if (endMs <= nowMs) return 0;
                        if (startMs >= nowMs) return 1;
                        return (endMs - nowMs) / 3600000;
                    };

                    const totalLiquidIn = dayHours.reduce((sum, h) => sum + (h.precipAmount || 0) * getRemainingFraction(h), 0);
                    const totalSnowIn = dayHours.reduce((sum, h) => sum + (h.snowAmount || 0) * getRemainingFraction(h), 0);
                    const totalIceIn = dayHours.reduce((sum, h) => sum + (h.iceAmount || 0) * getRemainingFraction(h), 0);

                    days.push({
                        date: date,
                        high: isToday && isPast5PM ? null : (highTemps.length > 0 ? Math.max(...highTemps) : null),
                        low: lowTemp,
                        hoursCount: dayHours.length,
                        startIdx: startIdx,
                        endIdx: endIdx,
                        precipProb: maxPrecipProb,
                        precipTotal: totalLiquidIn,
                        snowTotal: totalSnowIn,
                        iceTotal: totalIceIn,
                        description: dayPeriod ? dayPeriod.shortForecast : dayHours[Math.floor(dayHours.length / 2)].description,
                        dayIndex: i,
                        isToday: isToday,
                        shouldHide: i === 0 && hasHistoricalDayData
                    });
                }
            }
            
            const html = days.map((day) => {
                if (day.shouldHide) {
                    return `<div class="day-forecast" data-day-index="${day.dayIndex}" style="visibility: hidden;"></div>`;
                }

                const dayName = day.date.toLocaleDateString('en-US', { 
                    weekday: 'short', 
                    month: 'numeric',
                    day: 'numeric'
                });
                
                const highTemp = day.high !== null ? `${Math.round(day.high)}°` : '--';
                const lowTemp = day.low !== null ? `${Math.round(day.low)}°` : '--';
                const scopeLabel = day.isToday ? 'remaining today' : 'forecast';

                // Format precipitation total badge like Weather Underground (e.g. 💧 0.74 in, ❄️ 1.5 in)
                let precipBadgeHtml = '';
                if (day.snowTotal >= 0.1) {
                    const roundedSnow = day.snowTotal.toFixed(1);
                    precipBadgeHtml = `
                        <div class="day-precip-badge snow" title="${roundedSnow} in of snow ${scopeLabel}">
                            <span class="day-precip-icon">❄️</span>
                            <span>${roundedSnow} in</span>
                        </div>
                    `;
                } else if (day.iceTotal >= 0.05) {
                    const roundedIce = day.iceTotal.toFixed(2);
                    precipBadgeHtml = `
                        <div class="day-precip-badge ice" title="${roundedIce} in of ice accumulation ${scopeLabel}">
                            <span class="day-precip-icon">🧊</span>
                            <span>${roundedIce} in</span>
                        </div>
                    `;
                } else if (day.precipTotal >= 0.01) {
                    const roundedRain = day.precipTotal.toFixed(2);
                    precipBadgeHtml = `
                        <div class="day-precip-badge" title="${roundedRain} in of precipitation ${scopeLabel}">
                            <span class="day-precip-icon">💧</span>
                            <span>${roundedRain} in</span>
                        </div>
                    `;
                } else {
                    precipBadgeHtml = `
                        <div class="day-precip-badge dry" title="No measurable precipitation ${scopeLabel}">
                            <span class="day-precip-icon" style="opacity: 0.5;">💧</span>
                            <span>0 in</span>
                        </div>
                    `;
                }
                
                return `
                    <div class="day-forecast" 
                         data-day-index="${day.dayIndex}"
                         onclick="selectDay(${day.dayIndex})">
                        <div class="day-name">${dayName}</div>
                        <div class="day-icon">${getWeatherIcon(day.description, day.precipProb)}</div>
                        <div class="day-temps">
                            <span class="day-high">${highTemp}</span>
                            <span class="day-low">${lowTemp}</span>
                        </div>
                        <div class="day-detail">${day.description}</div>
                        ${precipBadgeHtml}
                    </div>
                `;
            }).join('');

            document.getElementById('dailyForecast').innerHTML = html;
        }

        function selectDay(dayIndex) {
            document.querySelectorAll('.day-forecast').forEach((el, i) => {
                el.classList.toggle('selected', i === dayIndex);
            });
            
            selectedDayIndex = selectedDayIndex === dayIndex ? null : dayIndex;
            showForecastForDay(dayIndex);
        }
        
        function getNightAnnotations(hourlyData) {
            const annotations = [];
            let inNight = false;
            let nightStart = null;
            
            hourlyData.forEach((hour, index) => {
                const { dateKey, hour: localHour } = getLocalHourAndDateKey(hour.time, currentTimeZone);
                const solar = getDailySolarHours(dateKey, currentLat, currentLon);
                
                // Night is when local hour is before rounded sunrise or at/after rounded sunset
                const isNight = localHour < solar.sunriseHour || localHour >= solar.sunsetHour;
                
                if (isNight && !inNight) {
                    nightStart = index;
                    inNight = true;
                } else if (!isNight && inNight) {
                    if (nightStart !== null) {
                        annotations.push({
                            type: 'box',
                            xMin: nightStart - 0.5,
                            xMax: index - 0.5,
                            backgroundColor: isDarkMode ? 'rgba(0, 0, 20, 0.35)' : 'rgba(20, 20, 50, 0.04)',
                            borderWidth: 0
                        });
                    }
                    inNight = false;
                    nightStart = null;
                }
            });
            
            if (inNight && nightStart !== null) {
                annotations.push({
                    type: 'box',
                    xMin: nightStart - 0.5,
                    xMax: hourlyData.length - 0.5,
                    backgroundColor: isDarkMode ? 'rgba(0, 0, 20, 0.35)' : 'rgba(20, 20, 50, 0.04)',
                    borderWidth: 0
                });
            }
            
            return annotations;
        }
		
        let touchStartX = null;
        let touchStartY = null;
        let isHorizontalSwipe = null;
       
        function setupCrosshair() {
            const chartsContainer = document.getElementById('chartsContainer');
            if (!chartsContainer) return;
            const canvases = chartsContainer.querySelectorAll('.chart-container');
            
            canvases.forEach(canvas => {
                canvas.addEventListener('mousemove', handlePointerMove);
                canvas.addEventListener('mouseleave', hideCrosshair);
                
                canvas.addEventListener('touchstart', handleTouchStart, { passive: false });
                canvas.addEventListener('touchmove', handleTouchMove, { passive: false });
                canvas.addEventListener('touchend', handleTouchEnd);
            });

            setupForecastScrollSync();
        }

        // Keep horizontal scroll of graphs synchronized with the daily forecast strip
        function setupForecastScrollSync() {
            const dailyForecastEl = document.getElementById('dailyForecastStrip');
            const chartsWrapperEl = document.getElementById('chartsWrapper');
            if (!dailyForecastEl || !chartsWrapperEl) return;

            dailyForecastEl.onscroll = () => {
                chartsWrapperEl.scrollLeft = dailyForecastEl.scrollLeft;
            };
        }
        
        function handlePointerMove(e) {
            const canvas = e.currentTarget.querySelector('canvas');
            if (!canvas) return;
            
            const chartId = canvas.id;
            const chart = charts[chartId];
            if (!chart) return;
            
            const canvasRect = canvas.getBoundingClientRect();
            const chartsContainer = document.getElementById('chartsContainer');
            const containerRect = chartsContainer.getBoundingClientRect();
            
            const xInCanvas = e.clientX - canvasRect.left;
            const xInContainer = e.clientX - containerRect.left;

            const dataX = chart.scales.x.getValueForPixel(xInCanvas);
            const index = Math.round(dataX);
            
            if (index >= 0 && index < chart.data.labels.length && globalHourlyData && globalHourlyData[index]) {
                updateCrosshair(index, xInContainer);
            }
        }
        
        function handleTouchStart(e) {
            const touch = e.touches[0];
            touchStartX = touch.clientX;
            touchStartY = touch.clientY;
            isHorizontalSwipe = null;
        }
        
        function handleTouchMove(e) {
            const touch = e.touches[0];
            
            const deltaX = Math.abs(touch.clientX - touchStartX);
            const deltaY = Math.abs(touch.clientY - touchStartY);
            
            if (isHorizontalSwipe === null && (deltaX > 6 || deltaY > 6)) {
                isHorizontalSwipe = deltaX > deltaY; 
            }
            
            if (isHorizontalSwipe === false) {
                return; // Allow page vertical scroll
            }
            
            if (isHorizontalSwipe === true) {
                e.preventDefault(); // Prevent page/chart native scroll while dragging stats cursor
                const canvas = e.currentTarget.querySelector('canvas');
                if (!canvas) return;
                
                const chartId = canvas.id;
                const chart = charts[chartId];
                if (!chart) return;
                
                const canvasRect = canvas.getBoundingClientRect();
                const chartsContainer = document.getElementById('chartsContainer');
                const containerRect = chartsContainer.getBoundingClientRect();
                
                const xInCanvas = touch.clientX - canvasRect.left;
                const xInContainer = touch.clientX - containerRect.left;
                
                const dataX = chart.scales.x.getValueForPixel(xInCanvas);
                const index = Math.round(dataX);
                
                if (index >= 0 && index < chart.data.labels.length && globalHourlyData && globalHourlyData[index]) {
                    updateCrosshair(index, xInContainer);
                }
            }
        }
		
        function handleTouchEnd() {
            touchStartX = null;
            touchStartY = null;
            isHorizontalSwipe = null;
            hideCrosshair();
        }
        
        function updateCrosshair(index, mouseX) {
            const crosshairLine = document.getElementById('crosshairLine');
            const crosshairTime = document.getElementById('crosshairTime');
            
            crosshairLine.style.left = `${mouseX}px`;
            crosshairLine.style.display = 'block';
            
            if (globalHourlyData && globalHourlyData[index]) {
                const date = globalHourlyData[index].time;
                const now = new Date();
                const isHistorical = date < now;
                
                const { hour: localHour } = getLocalHourAndDateKey(date, currentTimeZone);
                const dayStr = date.toLocaleDateString('en-US', { weekday: 'short', timeZone: currentTimeZone });
                const timeStr = localHour === 0 ? '12 AM' : localHour === 12 ? '12 PM' : localHour > 12 ? `${localHour - 12} PM` : `${localHour} AM`;
                
                crosshairTime.innerHTML = `${isHistorical ? '(Past)' : dayStr}<br>${timeStr}`;
                crosshairTime.style.display = 'block';
            }
            
            updateTooltipForChart('tempChart', 'tempTooltip', index, mouseX);
            updateTooltipForChart('combinedChart', 'combinedTooltip', index, mouseX);
            updateTooltipForChart('precipAmountChart', 'precipTooltip', index, mouseX);
            updateTooltipForChart('windChart', 'windTooltip', index, mouseX);
        }
        
        function updateTooltipForChart(chartId, tooltipId, index, mouseX) {
            const chart = charts[chartId];
            const tooltip = document.getElementById(tooltipId);
            const chartsContainer = document.getElementById('chartsContainer');
            
            if (!chart || !tooltip || !chartsContainer) return;
            
            const datasets = chart.data.datasets;
            
            let dataItems = [];
            datasets.forEach(dataset => {
                const value = dataset.data[index];
                if (value !== null && value !== undefined) {
                    dataItems.push({
                        label: dataset.label,
                        value: value,
                        formattedValue: formatValue(value, chartId)
                    });
                }
            });
            
            dataItems.sort((a, b) => b.value - a.value);
            
            const values = dataItems.map(item => `${item.label}: ${item.formattedValue}`);
            
            if (values.length > 0) {
                tooltip.innerHTML = values.join('<br>');
                
                // Flip tooltip to left of crosshair if near right boundary of container
                const containerWidth = chartsContainer.offsetWidth;
                if (mouseX > containerWidth - 145) {
                    tooltip.style.left = `${mouseX - 130}px`;
                } else {
                    tooltip.style.left = `${mouseX + 15}px`;
                }
                
                const yPos = chart.scales.y.getPixelForValue(datasets[0].data[index]);
                tooltip.style.top = `${yPos - 10}px`;
                tooltip.style.display = 'block';
            }
        }
        
        function formatValue(value, chartId) {
            if (chartId === 'tempChart') return `${Math.round(value)}°F`;
            if (chartId === 'combinedChart') return `${Math.round(value)}%`;
            if (chartId === 'precipAmountChart') return `${value.toFixed(2)}"`;
            if (chartId === 'windChart') return `${Math.round(value)} mph`;
            return value;
        }
        
        function hideCrosshair() {
            const crosshair = document.getElementById('crosshairLine');
            if (crosshair) crosshair.style.display = 'none';
            document.querySelectorAll('.chart-value-tooltip').forEach(tooltip => {

        function hexToRgba(hex, alpha = 1) {
            hex = hex.replace(/^#/, '');

            if (hex.length === 3) {
                hex = hex.split('').map(c => c + c).join('');
            }

            const r = parseInt(hex.substring(0, 2), 16);
            const g = parseInt(hex.substring(2, 4), 16);
            const b = parseInt(hex.substring(4, 6), 16);

            return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        }

        function getStateFromURL() {

            const lat = params.get('lat');
            const lon = params.get('lon');
            const name = params.get('name');
            const theme = params.get('theme');
            const recent = params.get('recent');
            
            let urlLocation = null;
            if (lat && lon) {
                const latitude = parseFloat(lat);
                const longitude = parseFloat(lon);
                
                if (!isNaN(latitude) && !isNaN(longitude) && 
                    latitude >= -90 && latitude <= 90 && 
                    longitude >= -180 && longitude <= 180) {
                    
                    urlLocation = {
                        lat: latitude,
                        lon: longitude,
                        name: name ? decodeURIComponent(name) : null
                    };
                }
            }
            
            return {
                location: urlLocation,
                theme: theme,
                recent: recent ? parseRecentLocations(recent) : null
            };
        }

        function updateURL(lat = currentLat, lon = currentLon, locationName = currentLocationName) {
            const params = new URLSearchParams();
            if (lat !== null && !isNaN(lat)) params.set('lat', lat.toFixed(4));
            if (lon !== null && !isNaN(lon)) params.set('lon', lon.toFixed(4));
            
            if (locationName) {
                params.set('name', encodeURIComponent(locationName));
            }

            if (isDarkMode) {
                params.set('theme', 'dark');
            }

            if (recentLocations && recentLocations.length > 0) {
                params.set('recent', serializeRecentLocations(recentLocations));
            }
            
            const newURL = window.location.pathname + '?' + params.toString();
            window.history.replaceState({ lat, lon, name: locationName, isDarkMode, recentLocations }, '', newURL);
        }

        function useMyLocation() {
            if (navigator.geolocation) {
                document.getElementById('locationName').textContent = 'Getting location...';
                document.getElementById('loading').style.display = 'block';
                document.getElementById('chartsContainer').style.display = 'none';
                
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        addRecentLocation(currentLocationName, currentLat, currentLon);

                        currentLat = position.coords.latitude;
                        currentLon = position.coords.longitude;
                        
                        reverseGeocode(currentLat, currentLon);
                        
                        currentElevation = null;
                        
                        Object.values(charts).forEach(chart => {
                            if (chart) chart.destroy();
                        });
                        charts = {};
                        
                        renderRecentLocations();
                        initializeForecast();
                    },
                    (error) => {
                        let errorMessage = 'Could not get your location. ';
                        
                        switch(error.code) {
                            case error.PERMISSION_DENIED:
                                errorMessage += 'Please allow location access in your browser settings and try again.';
                                break;
                            case error.POSITION_UNAVAILABLE:
                                errorMessage += 'Location information is currently unavailable.';
                                break;
                            case error.TIMEOUT:
                                errorMessage += 'Location request timed out.';
                                break;
                            default:
                                errorMessage += 'An unknown error occurred.';
                        }
                        
                        showStatusToast(errorMessage, true);
                        document.getElementById('locationName').textContent = currentLocationName;
                        document.getElementById('loading').style.display = 'none';
                        document.getElementById('chartsContainer').style.display = 'block';
                    },
                    {
                        enableHighAccuracy: true,
                        timeout: 10000,
                        maximumAge: 0
                    }
                );
            } else {
                showStatusToast('Geolocation is not supported by your browser.', true);
            }
        }

        function initializeApp() {
            const state = getStateFromURL();

            // Set up dark mode from URL or localStorage
            if (state.theme === 'dark') {
                isDarkMode = true;
            } else if (state.theme === 'light') {
                isDarkMode = false;
            } else {
                try {
                    isDarkMode = localStorage.getItem('weather_theme') === 'dark';
                } catch (e) {
                    isDarkMode = false;
                }
            }
            applyTheme();

            // Set up recent locations from URL or localStorage
            if (state.recent && state.recent.length > 0) {
                recentLocations = state.recent;
            } else {
                try {
                    const saved = localStorage.getItem('weather_recent_v2');
                    if (saved) {
                        const parsed = JSON.parse(saved);
                        if (Array.isArray(parsed) && parsed.length > 0) {
                            recentLocations = parsed;
                        }
                    }
                } catch (e) {}
            }
            
            if (state.location) {
                currentLat = state.location.lat;
                currentLon = state.location.lon;
                
                if (state.location.name) {
                    currentLocationName = state.location.name;
                    document.getElementById('locationName').textContent = currentLocationName;
                } else {
                    reverseGeocode(currentLat, currentLon);
                }
            } else {
                updateURL(currentLat, currentLon, currentLocationName);
            }

            renderRecentLocations();
            setupForecastScrollSync();
            initializeForecast();
        }

        async function reverseGeocode(lat, lon) {
            try {
                const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&addressdetails=1`);
                const data = await response.json();
                
                if (data) {
                    currentLocationName = formatNominatimName(data);
                    document.getElementById('locationName').textContent = currentLocationName;
                    updateURL(lat, lon, currentLocationName);
                }
            } catch (error) {
                console.error('Reverse geocoding error:', error);
                currentLocationName = `${lat.toFixed(4)}°, ${lon.toFixed(4)}°`;
                document.getElementById('locationName').textContent = currentLocationName;
            }
        }

        window.addEventListener('popstate', (event) => {
            const state = getStateFromURL();
            if (state.theme !== null) {
                isDarkMode = state.theme === 'dark';
                applyTheme();
            }
            if (state.recent) {
                recentLocations = state.recent;
                renderRecentLocations();
            }
            if (state.location) {
                currentLat = state.location.lat;
                currentLon = state.location.lon;
                currentLocationName = state.location.name || `${currentLat.toFixed(4)}°, ${currentLon.toFixed(4)}°`;
                document.getElementById('locationName').textContent = currentLocationName;
                
                Object.values(charts).forEach(chart => {
                    if (chart) chart.destroy();
                });
                charts = {};
                
                renderRecentLocations();
                initializeForecast();
            }
        });
		
        window.addEventListener('resize', () => {
            syncCurrentConditionsIndent();
            if (charts['tempChart']) {
                setTimeout(alignDailyForecastWithChart, 100);
            }
        });

        async function initializeForecast() {
            try {
                document.getElementById('loading').style.display = 'block';
                document.getElementById('chartsContainer').style.display = 'none';
                document.getElementById('currentConditions').innerHTML = '<div class="loading">Loading current conditions...</div>';
                const riseEl = document.getElementById('sunriseTime');
                const setEl = document.getElementById('sunsetTime');
                if (riseEl) riseEl.textContent = '--:--';
                if (setEl) setEl.textContent = '--:--';
                
                const data = await getForecastData();
                
                updateLocationDetails();
                
                const now = new Date();
                document.getElementById('lastUpdated').textContent = 
                    `Last updated: ${now.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true })}`;
                
                const hourlyData = processGriddedDataToHourly(data.gridded);
                
                createCurrentConditions(hourlyData);
                createDetailedForcast(data.daily);
                createDailyForecast(data.daily, hourlyData);
                
                document.getElementById('loading').style.display = 'none';
                document.getElementById('chartsContainer').style.display = 'block';
                
                createCharts(hourlyData);
                
            } catch (error) {
                console.error("Failed to initialize forecast:", error);
            }
        }
        
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initializeApp);
        } else {
            initializeApp();
        }
        setInterval(initializeForecast, 30 * 60 * 1000);
    </script>
</body>
</html>
